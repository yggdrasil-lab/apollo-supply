services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080" # qBittorrent UI
      - "8085:8085" # SABnzbd UI
    volumes:
      - /opt/apollo-supply/gluetun:/gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
      - DNS_ADDRESS=1.1.1.1,1.0.0.1
      - VPN_SERVICE_PROVIDER
      - VPN_USER
      - VPN_PASSWORD
      - VPN_TYPE
      - WIREGUARD_PRIVATE_KEY
      - WIREGUARD_PRESHARED_KEY
      - WIREGUARD_ADDRESSES
      - BLOCK_MALICIOUS=off
      - WIREGUARD_MTU=1280
      - FIREWALL_VPN_INPUT_PORTS=${FIREWALL_VPN_INPUT_PORTS}
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=apollo-supply"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
      - WEBUI_PORT=8080
    volumes:
      - /opt/apollo-supply/qbittorrent:/config
      - /mnt/storage/downloads:/downloads
    labels:
      - "com.docker.compose.project=apollo-supply"
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - /opt/apollo-supply/sabnzbd:/config
      - /mnt/storage/downloads:/downloads
    labels:
      - "com.docker.compose.project=apollo-supply"
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

networks:
  aether-net:
    name: aether-net
    external: true
